# Prueba aislada de RITA v5.1.2 sobre los logs de Zeek del laboratorio (sin instalar en el sistema)
name: rita-prueba
volumes:
  clickhouse_prueba:
services:
  rita:
    image: ghcr.io/activecm/rita:v5.1.2
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./etc/config.hjson:/config.hjson
      - ./etc/http_extensions_list.csv:/etc/rita/http_extensions_list.csv
      - ./etc/threat_intel_feeds:/etc/rita/threat_intel_feeds
      - ./.env:/.env
      - ./zeek:/tmp/zeek_logs:ro
    links:
      - "clickhouse:db"
    environment:
      - DB_ADDRESS=db:9000
      - TERM=xterm-256color
  clickhouse:
    image: clickhouse/clickhouse-server:24.1.6
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 3s
      start_period: 1s
      retries: 30
    expose:
      - 9000
    volumes:
      - clickhouse_prueba:/var/lib/clickhouse
      - ./etc/config.xml:/etc/clickhouse-server/users.d/custom_config.xml
    ulimits:
      nofile:
        soft: 131070
        hard: 131070
